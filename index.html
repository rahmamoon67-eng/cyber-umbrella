<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; user-select: none; cursor: none !important; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #020005; font-family: 'Segoe UI', system-ui, sans-serif; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .neon-pointer { width: 16px; height: 16px; background: #fff; border: 3px solid #ff0055; border-radius: 50%; position: fixed; transform: translate(-50%, -50%); pointer-events: none; z-index: 99999; box-shadow: 0 0 20px #ff0055, 0 0 40px #fff; }
        .neon-aura { width: 45px; height: 45px; border: 2px dashed #00f0ff; border-radius: 50%; position: fixed; transform: translate(-50%, -50%); pointer-events: none; z-index: 99998; box-shadow: 0 0 15px #ff0055; animation: rotateAura 1s linear infinite; }
        @keyframes rotateAura { to { transform: translate(-50%, -50%) rotate(360deg); } }
        .intro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .matrix-stream { width: 85%; max-width: 750px; height: 300px; background: rgba(5,0,10,0.9); border: 2px solid #ff0055; border-radius: 20px; padding: 20px; color: #ff0055; font-family: monospace; font-size: 1.1rem; overflow-y: hidden; text-align: left; direction: ltr; white-space: pre-line; display: none; box-shadow: 0 0 40px rgba(255,0,85,0.4); }
        .quote-box { color: #fff; font-size: 1.4rem; font-weight: bold; text-align: center; max-width: 550px; display: none; margin-bottom: 30px; text-shadow: 0 0 15px #ff0055; line-height: 1.6; }
        .start-btn { padding: 15px 45px; background: linear-gradient(45deg, #ff0055, #00f0ff); color: #fff; font-weight: 900; font-size: 1.3rem; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 25px #ff0055; display: block; }
        .hack-final-btn { padding: 15px 50px; background: linear-gradient(45deg, #00f0ff, #fff); color: #000; font-weight: 900; font-size: 1.4rem; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 30px #00f0ff; display: none; }
        .main-app-interface { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; padding: 20px; grid-template-columns: 280px 1fr; gap: 20px; }
        .sidebar { background: rgba(10, 2, 18, 0.9); border: 2px solid #ff0055; border-radius: 25px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 0 30px rgba(255,0,85,0.2); }
        .app-title { color: #fff; font-size: 2.2rem; font-weight: 900; letter-spacing: 3px; text-shadow: 0 0 15px #ff0055; margin-bottom: 5px; }
        .anime-avatar-live { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #00f0ff; box-shadow: 0 0 20px #00f0ff; background: url('https://imgur.com') no-repeat center center/cover; margin: 20px 0; position: relative; }
        .anime-avatar-live::after { content: 'LIVE'; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); background: #ff0055; color: #fff; font-size: 0.7rem; font-weight: bold; padding: 1px 8px; border-radius: 10px; }
        .nav-menu { width: 100%; margin-top: 20px; }
        .nav-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(0,240,255,0.2); border-radius: 15px; padding: 15px; color: #fff; font-weight: bold; font-size: 1.1rem; margin-bottom: 15px; display: flex; align-items: center; gap: 12px; transition: all 0.2s; }
        .nav-item:hover { background: #ff0055; border-color: #fff; transform: scale(1.05) translateY(-3px); box-shadow: 0 0 25px #ff0055; }
        .nav-item i { color: #00f0ff; font-size: 1.4rem; }
        .nav-item:hover i { color: #fff; }
        .content-area { background: rgba(5,1,12,0.85); border: 2px solid #00f0ff; border-radius: 25px; padding: 30px; overflow-y: auto; box-shadow: 0 0 30px rgba(0,240,255,0.1); backdrop-filter: blur(15px); }
        .feed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .feed-card { background: #000; border: 1px solid rgba(255,0,85,0.3); border-radius: 18px; height: 320px; overflow: hidden; position: relative; transition: all 0.3s; }
        .feed-card:hover { border-color: #ff0055; transform: translateY(-8px); box-shadow: 0 8px 25px rgba(255,0,85,0.4); }
        .card-video-mock { width: 100%; height: 100%; background: linear-gradient(135deg, #1a0010, #001520); display: flex; justify-content: center; align-items: center; font-size: 3rem; color: rgba(255,255,255,0.15); }
        .feed-card:hover .card-video-mock { color: #ff0055; background: linear-gradient(135deg, #300020, #002535); }
        .inject-btn { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 1px solid #00f0ff; color: #00f0ff; padding: 8px 20px; border-radius: 50px; font-weight: bold; font-size: 0.9rem; box-shadow: 0 0 10px rgba(0,240,255,0.2); transition: all 0.2s; }
        .feed-card:hover .inject-btn { background: #ff0055; color: #fff; border-color: #fff; box-shadow: 0 0 20px #ff0055; }
    </style>
</head>
<body style="transition: transform 0.05s linear;">

            <p style="color: #a5b1c2; margin: 5px 0 25px 0;">تصفحي التنسيقات الإبداعية ومقاطع الأنمي بسرعة مجنونة واضغطي لحقن الإلهام!</p>

                <div class="feed-card"><div class="card-video-mock"><i class="fa-brands fa-tiktok"></i></div><button class="inject-btn" onclick="injectPayload()">حقن الإلهام 💉</button></div>

                <div class="feed-card"><div class="card-video-mock"><i class="fa-solid fa-wand-magic-sparkles"></i></div><button class="inject-btn" onclick="injectPayload()">حقن الإلهام 💉</button></div>

    <script>
        const pointer = document.getElementById('pointer'); const aura = document.getElementById('aura');
        let trailParticles = []; let gridParticles = []; let coreColor = "#ff0055"; let audioCtx;
        document.addEventListener('mousemove', (e) => {
            pointer.style.left = e.clientX + 'px'; pointer.style.top = e.clientY + 'px'; aura.style.left = e.clientX + 'px'; aura.style.top = e.clientY + 'px';
            for(let i=0; i<2; i++) { trailParticles.push({ x: e.clientX, y: e.clientY, size: Math.random() * 6 + 2, speedX: Math.random() * 4 - 2, speedY: Math.random() * 4 - 2, alpha: 1, color: Math.random() > 0.5 ? "#ffffff" : "#ff0055" }); }
        });
        const canvas = document.getElementById('multiverseCanvas'); const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        for(let i=0; i<90; i++) { gridParticles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 3 + 1, speedY: Math.random() * 2 + 1 }); }
        function runVisualEngine() {
            ctx.fillStyle = 'rgba(2, 0, 5, 0.08)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.shadowBlur = 12; ctx.shadowColor = coreColor; ctx.fillStyle = coreColor;
            gridParticles.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); p.y += p.speedY; if(p.y > canvas.height) p.y = -10; });
